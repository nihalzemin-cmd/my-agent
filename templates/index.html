<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal AI Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: white; font-family: Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #1a1a2e; padding: 20px; text-align: center; }
        .header h1 { color: #00d4ff; font-size: 24px; }
        .header p { color: #888; font-size: 14px; }
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 70%; padding: 12px 18px; border-radius: 18px; line-height: 1.5; }
        .user-message { background: #00d4ff; color: black; align-self: flex-end; border-bottom-right-radius: 4px; }
        .agent-message { background: #1e1e3f; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
        .input-area { background: #1a1a2e; padding: 20px; display: flex; gap: 10px; }
        input { flex: 1; background: #2a2a4e; border: none; padding: 15px 20px; border-radius: 25px; color: white; font-size: 16px; outline: none; }
        button { border: none; padding: 15px 25px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; }
        #sendBtn { background: #00d4ff; color: black; }
        #micBtn { background: #1e1e3f; color: white; font-size: 20px; }
        #micBtn.listening { background: red; }
        #stopBtn { background: #ff4444; color: white; font-size: 20px; }
        .typing { color: #888; font-style: italic; padding: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 My Personal AI Agent</h1>
        <p>Your personal understanding partner</p>
    </div>
    <div class="chat-box" id="chatBox">
        <div class="message agent-message">Hey Nihal! I'm your personal AI agent. Type or use 🎤 to talk! 😊</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your message..." onkeypress="handleKey(event)"/>
        <button id="micBtn" onclick="toggleVoice()">🎤</button>
        <button id="stopBtn" onclick="stopSpeaking()">⏹️</button>
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
    <script>
        let recognition;
        let listening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'en-US';
            recognition.onresult = (event) => {
                document.getElementById("userInput").value = event.results[0][0].transcript;
                sendMessage();
            };
            recognition.onend = () => {
                listening = false;
                document.getElementById("micBtn").classList.remove("listening");
            };
        }

        function toggleVoice() {
            if (!recognition) { alert("Use Chrome for voice support!"); return; }
            if (listening) {
                recognition.stop();
            } else {
                recognition.start();
                listening = true;
                document.getElementById("micBtn").classList.add("listening");
            }
        }

        function stopSpeaking() {
            window.speechSynthesis.cancel();
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const chatBox = document.getElementById("chatBox");
            const message = input.value.trim();
            if (!message) return;

            chatBox.innerHTML += `<div class="message user-message">${message}</div>`;
            input.value = "";
            chatBox.innerHTML += `<div class="typing" id="typing">Agent is thinking...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            const response = await fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message: message})
            });

            const data = await response.json();
            document.getElementById("typing").remove();
            chatBox.innerHTML += `<div class="message agent-message">${data.reply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
            speak(data.reply);
        }

        function handleKey(event) {
            if (event.key === "Enter") sendMessage();
        }
    </script>
</body>
</html>
