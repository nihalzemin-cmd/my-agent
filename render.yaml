services:
  - type: web
    name: my-ai-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GROQ_API_KEY
        sync: false # Set your Groq API Key in the Render dashboard
      - key: PORT
        value: 5000
    plan: free
