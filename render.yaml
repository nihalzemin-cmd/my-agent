services:
  - type: web
    name: my-ai-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GROQ_API_KEY
        sync: false # Set this in Render Dashboard for security
      - key: PYTHON_VERSION
        value: 3.11.0 # Or your preferred version
